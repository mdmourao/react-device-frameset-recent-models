name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/build
        env:
          # Serve the demo from https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback
        run: cp packages/react-device-frameset-example/dist/index.html packages/react-device-frameset-example/dist/404.html

      - name: Serve llms.txt for AI agents
        run: cp packages/react-device-frameset/llms.txt packages/react-device-frameset-example/dist/llms.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/react-device-frameset-example/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
